
name: Sentiment Analysis - Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q app.py train_final_model.py

      - name: Verify required project files
        run: |
          python -c "from pathlib import Path; files = ['app.py', 'model.pkl', 'word_vectorizer.pkl', 'char_vectorizer.pkl', 'requirements.txt']; missing = [f for f in files if not Path(f).is_file()]; print('Missing files:', missing) if missing else print('All required files found'); exit(bool(missing))"
