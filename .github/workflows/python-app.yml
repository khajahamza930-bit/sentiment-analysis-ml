
name: Sentiment Analysis - Python CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Test Sentiment Analysis Project
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Check Python syntax
      - name: Check Python syntax
        run: |
          python -m compileall -q app.py train_final_model.py tests

      # Step 5: Verify trained model files
      - name: Verify required project files
        run: |
          python -c "from pathlib import Path; files = ['app.py', 'model.pkl', 'word_vectorizer.pkl', 'char_vectorizer.pkl', 'requirements.txt', 'tests/test_prediction.py']; missing = [f for f in files if not Path(f).is_file()]; print('Missing files:', missing) if missing else print('All required files found'); exit(bool(missing))"

      # Step 6: Run automated ML prediction tests
      - name: Run ML prediction tests
        run: |
          pytest -v
